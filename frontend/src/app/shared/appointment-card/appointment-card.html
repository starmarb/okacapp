@let appt = appointment();

<div class="relative">
  <a
    [routerLink]="['/appointment', appt.id]"
    class="card card-interactive flex items-start justify-between gap-4 px-5 py-4 text-sm"
  >
    <div class="flex min-w-0 flex-col gap-1">
      <p class="font-semibold">
        {{ appt.appointment_date | date: 'MMM d, h:mma' }}
      </p>
      @if (appt.address) {
        <p>
          {{ appt.address }}
        </p>
      }
      @if (appt.phone) {
        <p class="text-neutral-600">{{ appt.phone }}</p>
      }
    </div>
    <app-service-type-badge [service_type]="appt.service_type" />
  </a>

  <button
    type="button"
    class="absolute bottom-3 right-3 z-10 rounded-full p-2 text-neutral-500 hover:bg-neutral-100 hover:text-neutral-900"
    aria-label="More options"
    (click)="openOptions()"
  >
    <mat-icon fontIcon="more_horiz" aria-hidden="true" />
  </button>
</div>
