@let appt = appointment();

<a
  [routerLink]="['/appointment', appt.id]"
  class="flex w-full items-start justify-between gap-4 rounded-lg border border-neutral-200 px-5 py-4 text-sm hover:border-neutral-300 hover:bg-neutral-50 bg-card shadow-sm"
>
  <div class="flex min-w-0 flex-col gap-1">
    <p class="font-semibold">
      {{ appt.appointment_date | date: 'MMM d, h:mma' }}
    </p>
    @if (appt.address) {
      <p class="truncate text-neutral-600">{{ appt.address }}</p>
    }
    @if (appt.phone) {
      <p class="text-neutral-600">{{ appt.phone }}</p>
    }
  </div>

  <app-service-type-badge [service_type]="appt.service_type" />
</a>
