@let photo = current();

<div class="relative flex h-full w-full items-center justify-center">
  <button
    type="button"
    class="absolute right-3 top-3 z-10 rounded-full bg-black/40 p-2 text-white hover:bg-black/60"
    aria-label="Close"
    (click)="close()"
  >
    <mat-icon fontIcon="close" />
  </button>

  @if (photo) {
    <img
      [src]="photo.url"
      [attr.width]="photo.width"
      [attr.height]="photo.height"
      alt=""
      class="max-h-full max-w-full object-contain"
    />

    @if (data.photos.length > 1) {
      <button
        type="button"
        class="absolute left-3 top-1/2 z-10 -translate-y-1/2 rounded-full bg-black/40 p-2 text-white hover:bg-black/60 disabled:opacity-30"
        aria-label="Previous photo"
        [disabled]="index() === 0"
        (click)="prev()"
      >
        <mat-icon fontIcon="chevron_left" />
      </button>

      <button
        type="button"
        class="absolute right-3 top-1/2 z-10 -translate-y-1/2 rounded-full bg-black/40 p-2 text-white hover:bg-black/60 disabled:opacity-30"
        aria-label="Next photo"
        [disabled]="index() === data.photos.length - 1"
        (click)="next()"
      >
        <mat-icon fontIcon="chevron_right" />
      </button>

      <span
        class="absolute bottom-4 left-1/2 -translate-x-1/2 rounded-full bg-black/40 px-3 py-1 text-xs text-white"
      >
        {{ index() + 1 }} / {{ data.photos.length }}
      </span>
    }
  }
</div>
