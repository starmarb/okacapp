<div class="flex flex-col p-3">
  @defer (when appointment.hasValue()) {
    @let appt = appointment.value()!;

    <div class="mb-3 grid grid-cols-[1fr_auto_1fr] items-center">
      <button mat-icon-button class="justify-self-start" routerLink="/">
        <mat-icon fontIcon="arrow_back_ios" />
      </button>
      <h1 class="text-lg font-semibold">Appointment Details</h1>
      <button mat-icon-button class="justify-self-end">
        <mat-icon fontIcon="edit" (click)="openForm()" />
      </button>
    </div>

    <app-appointment-card [appointment]="appt" />
  } @placeholder {
    <p class="text-sm font-thin">Loading…</p>
  } @error {
    <p class="text-sm font-thin">Failed to load appointments.</p>
  }
</div>
